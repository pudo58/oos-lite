[workspace]
members = [
    "core",
    "cli",
    "benchmarks",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OOS-Lite Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1.5"
crc32fast = "1.4"
fastcdc = "1.0"
sled = "0.34"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

