[workspace]
members = [
    "core",
    "cli",
    "benchmarks",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["OOS-Lite Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1.5"
crc32fast = "1.4"
fastcdc = "1.0"
sled = "0.34"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
zstd = "0.13"
fs2 = "0.4"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
zeroize = { version = "1.7", features = ["derive"] }
notify = "6.1"
walkdir = "2.5"
glob = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

