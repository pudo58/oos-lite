name: Release / Build Assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build optimized binaries
        run: cargo build --release -p oos-lite --bins --locked

      - name: Package portable bundle and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path target\release\oos-lite.exe,target\release\oos-lite-gui.exe,uninstall.bat,README.md,LICENSE-MIT,LICENSE-APACHE `
            -DestinationPath dist\oos-lite-windows-x86_64-v1.0.0.zip `
            -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\oos-lite.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/OOS-Lite-Setup-v1.0.0.exe
            dist/oos-lite-windows-x86_64-v1.0.0.zip

  build-linux:
    name: Build Linux asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install FUSE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfuse3-dev libwayland-dev libxkbcommon-dev libdbus-1-dev

      - name: Build optimized binaries
        run: cargo build --release -p oos-lite --bins --locked

      - name: Package Linux bundle
        run: |
          mkdir -p dist/package
          cp target/release/oos-lite target/release/oos-lite-gui README.md LICENSE-MIT LICENSE-APACHE dist/package/
          tar -czf dist/oos-lite-linux-x86_64-v1.0.0.tar.gz -C dist/package .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: dist/oos-lite-linux-x86_64-v1.0.0.tar.gz

  publish:
    name: Publish GitHub release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum OOS-Lite-Setup-v1.0.0.exe oos-lite-windows-x86_64-v1.0.0.zip oos-lite-linux-x86_64-v1.0.0.tar.gz > SHA256SUMS.txt

      - name: Publish release and assets
        uses: softprops/action-gh-release@v2
        with:
          name: OOS-Lite v1.0.0 - Reliable Local-First Storage
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/OOS-Lite-Setup-v1.0.0.exe
            dist/oos-lite-windows-x86_64-v1.0.0.zip
            dist/oos-lite-linux-x86_64-v1.0.0.tar.gz
            dist/SHA256SUMS.txt
